<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>macOS 27互換性情報</title>
  <meta name="description" content="macOS 27対応状況を公開データから確認できます。">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="hero">
      <p class="eyebrow">PUBLIC COMPATIBILITY DATA</p>
      <h1>macOS 27互換性情報</h1>
      <p class="lead">アプリごとの対応状況と確認元を、公開JSONから表示しています。</p>
      <p class="updated">最終更新: <time id="updated-at">読み込み中…</time></p>
    </header>

    <section class="summary" aria-label="集計">
      <div class="summary-card"><span>掲載アプリ</span><strong id="total-count">—</strong></div>
      <div class="summary-card"><span>確認済み</span><strong id="checked-count">—</strong></div>
      <div class="summary-card"><span>注意・未確認</span><strong id="attention-count">—</strong></div>
    </section>

    <section class="panel">
      <div class="panel-heading">
        <div>
          <p class="eyebrow">APPS</p>
          <h2>アプリ対応状況</h2>
        </div>
        <label class="search">検索 <input id="search" type="search" placeholder="アプリ名・開発元"></label>
      </div>
      <div id="state" class="state" role="status">データを読み込んでいます…</div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>アプリ</th><th>開発元</th><th>状態</th><th>確認日</th><th>メモ</th></tr></thead>
          <tbody id="apps-body"></tbody>
        </table>
      </div>
    </section>

    <section class="panel sources-panel">
      <div class="panel-heading">
        <div>
          <p class="eyebrow">SOURCES</p>
          <h2>確認元</h2>
        </div>
        <a href="research_sources.json">research_sources.json</a>
      </div>
      <ul id="sources-list" class="sources-list"></ul>
    </section>

    <footer>
      <a href="https://github.com/ponhouse/macos-compat">GitHubでデータを見る</a>
      <span>公開データは内容を確認のうえご利用ください。</span>
    </footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
